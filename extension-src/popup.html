<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AshiPad Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="doc-controls">
        <select id="docSelector" class="doc-selector"></select>
        <button id="newBtn" class="icon-btn" title="New Document">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button id="deleteBtn" class="icon-btn danger" title="Delete Document">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
      <div class="toolbar" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div style="display:flex; gap:4px; flex:1;">
          <button onmousedown="event.preventDefault(); document.execCommand('bold',false,null)" class="format-btn" title="Bold"><b>B</b></button>
          <button onmousedown="event.preventDefault(); document.execCommand('italic',false,null)" class="format-btn" title="Italic"><i>I</i></button>
          <button onmousedown="event.preventDefault(); document.execCommand('underline',false,null)" class="format-btn" title="Underline"><u>U</u></button>
          <button onmousedown="event.preventDefault(); document.execCommand('strikethrough',false,null)" class="format-btn" title="Strikethrough"><s>S</s></button>
        </div>
        <button id="toggleRtfBtn" class="format-btn" style="flex:0 0 auto; padding: 6px 12px;" title="Toggle RTF Source">RTF View</button>
        <button id="copyRtfBtn" class="format-btn hidden" style="flex:0 0 auto; padding: 6px 12px; background:var(--accent); color:white; border-color:var(--accent);" title="Copy RTF Source">Copy RTF</button>
      </div>
    </header>
    
    <main class="editor-container">
      <input type="text" id="docTitle" placeholder="Document Title" class="doc-title-input" autocomplete="off" spellcheck="false">
      <div id="editor" contenteditable="true" spellcheck="false" placeholder="Start typing..."></div>
      <textarea id="source" class="hidden" spellcheck="false" placeholder="{\rtf1 ...}"></textarea>
    </main>
    
    <footer class="footer">
      <span id="saveState">All changes saved</span>
    </footer>
  </div>
  
  <!-- Delete Modal -->
  <div class="backdrop hidden" id="deleteModal">
    <div class="modal">
      <h2>Delete Document?</h2>
      <div class="modal-actions">
        <button id="deleteCancel" class="modal-btn">Cancel</button>
        <button id="deleteConfirmBtn" class="modal-btn danger-bg">Delete</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
